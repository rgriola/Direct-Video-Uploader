steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/direct-video-uploader:$COMMIT_SHA', '.']

  # Step 2: Push the Docker image to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/direct-video-uploader:$COMMIT_SHA']

  # Step 3: Run Database Migrations (using the newly built image)
  - name: 'gcr.io/$PROJECT_ID/direct-video-uploader:$COMMIT_SHA'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npx prisma migrate deploy'
    secretEnv: ['DATABASE_URL']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'direct-video-uploader'
      - '--image'
      - 'gcr.io/$PROJECT_ID/direct-video-uploader:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,MUX_TOKEN_ID=MUX_TOKEN_ID:latest,MUX_TOKEN_SECRET=MUX_TOKEN_SECRET:latest,MUX_ENV_KEY=MUX_ENV_KEY:latest,MUX_WEBHOOK_SECRET=MUX_WEBHOOK_SECRET:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'

images:
  - 'gcr.io/$PROJECT_ID/direct-video-uploader:$COMMIT_SHA'
