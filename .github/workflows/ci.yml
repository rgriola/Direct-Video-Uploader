name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  original-backup-tests:
    name: Original Backup Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned rclone for backup tests
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/rclone.zip" \
            https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  $RUNNER_TEMP/rclone.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-v1.75.1-linux-amd64" >> "$GITHUB_PATH"

      - name: Test encrypted original backups
        run: python3 -m unittest discover -s scripts -p 'test_backup_originals.py' -v

  ios-launchscreen-guard:
    name: iOS Launch Screen Guard
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify launch screen contract
        run: bash ./scripts/verify-ios-launchscreen.sh

      - name: Verify simulator selection
        run: python3 -m unittest discover -s scripts -p 'test_select_ios_simulator.py'

      - name: Run iOS unit tests
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -project ios/DirectVideoUploader.xcodeproj \
            -scheme DirectVideoUploader -showdestinations > /dev/null
          simulator_id="$(xcrun simctl list -j | python3 scripts/select_ios_simulator.py)"
          echo "Running iOS tests on simulator $simulator_id"
          xcodebuild -project ios/DirectVideoUploader.xcodeproj \
            -scheme DirectVideoUploader \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dvu_scope_test_ci
          POSTGRES_USER: scope_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope_test -d dvu_scope_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scope_test:test-only-password@127.0.0.1:5432/dvu_scope_test_ci
      TEST_DATABASE_URL: postgresql://scope_test:test-only-password@127.0.0.1:5432/dvu_scope_test_ci
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (lockfile-enforced)
        run: npm ci

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Migrate disposable test database
        run: npx prisma migrate deploy

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies (lockfile-enforced)
        run: npm ci

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Type-check admin
        run: npm run typecheck

      - name: Test admin
        run: npm test

      - name: Build admin
        run: npm run build
