# May 12, 2026 - 2:37pm - GitHub Copilot (GPT-5.3-Codex)
name: DirectVideoUploader
options:
  bundleIdPrefix: com.directvideo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Debug-Staging: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: LW5P4PVL96
    CODE_SIGN_STYLE: Automatic

targets:
  DirectVideoUploader:
    type: application
    platform: iOS
    sources:
      - DirectVideoUploader
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Fixer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBg
        INFOPLIST_KEY_UILaunchScreen_ImageName: launchscreen
        INFOPLIST_KEY_UILaunchScreen_ImageRespectsSafeAreaInsets: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select videos to upload to the newsroom server."
        INFOPLIST_KEY_NSCameraUsageDescription: "Record video to upload to the newsroom server."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Attach GPS coordinates to your video upload."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe audio from your uploaded videos for searchable captions."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Required by the speech recognition framework for audio processing."
        PRODUCT_BUNDLE_IDENTIFIER: com.directvideo.uploader
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Debug-Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG STAGING"
          DVU_SERVER_URL: "https://staging.ms-fixer.com"
    info:
      path: DirectVideoUploader/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBg
          UIImageName: launchscreen
