# Render Blueprint — Direct Video Uploader
# Deploy: Connect GitHub repo → Render auto-detects this file
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: directvideo-db
    plan: free
    databaseName: directvideo
    user: directvideo

services:
  - type: web
    name: direct-video-uploader
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: directvideo-db
          property: connectionString
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_ENV_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
