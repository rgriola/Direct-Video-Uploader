# Render Blueprint — Direct Video Uploader
# Last updated: May 9, 2026 - 6:01pm
# Deploy: Connect GitHub repo → Render auto-detects this file
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: directvideo-db
    plan: free
    databaseName: directvideo
    user: directvideo

services:
  - type: web
    name: direct-video-uploader
    runtime: node
    nodeVersion: 22
    plan: starter
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm ci --include=dev && cd ../admin && npm ci --include=dev && npm run build && cd ../server && npx prisma generate && npx prisma migrate deploy && node src/seed.js
    startCommand: npm run start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: directvideo-db
          property: connectionString
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_ENV_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        value: https://ms-fixer.com
