# Render Blueprint — Direct Video Uploader
# Deploy: Connect GitHub repo → Render auto-detects this file
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: directvideo-db
    plan: free
    databaseName: directvideo
    user: directvideo

services:
  - type: web
    name: direct-video-uploader
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: ./scripts/render-build.sh
    startCommand: cd server && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: directvideo-db
          property: connectionString
      # Phase 3 — uncomment when ready
      # - key: MUX_TOKEN_ID
      #   sync: false
      # - key: MUX_TOKEN_SECRET
      #   sync: false
      # - key: SLACK_WEBHOOK_URL
      #   sync: false
