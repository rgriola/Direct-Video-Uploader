# Render Blueprint — Direct Video Uploader
# Last updated: May 13, 2026 - 2:05pm - GitHub Copilot (GPT-5.3-Codex)
# Deploy: Connect GitHub repo → Render auto-detects this file
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: directvideo-db
    plan: free
    databaseName: directvideo
    user: directvideo
  - name: directvideo-staging-db
    plan: free
    databaseName: directvideo_staging
    user: directvideo_staging

services:
  - type: keyvalue
    name: directvideo-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: keyvalue
    name: directvideo-staging-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: direct-video-uploader
    runtime: node
    nodeVersion: 22
    plan: starter
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm ci --include=dev && cd ../admin && npm ci --include=dev && npm run build && cd ../server && npx prisma generate && node scripts/prisma-baseline-if-needed.js && npx prisma migrate deploy && node src/seed.js
    startCommand: npm run start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: directvideo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: directvideo-redis
          property: connectionString
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_ENV_KEY
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_ALERT_CHANNEL
        value: general
      - key: PUBLIC_URL
        value: https://ms-fixer.com

  - type: web
    name: direct-video-uploader-staging
    runtime: node
    nodeVersion: 22
    plan: starter
    region: oregon
    branch: staging
    rootDir: server
    buildCommand: npm ci --include=dev && cd ../admin && npm ci --include=dev && npm run build && cd ../server && npx prisma generate && node scripts/prisma-baseline-if-needed.js && npx prisma migrate deploy && node src/seed.js
    startCommand: npm run start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: directvideo-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: directvideo-staging-redis
          property: connectionString
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_ENV_KEY
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_ALERT_CHANNEL
        value: staging-alerts
      - key: PUBLIC_URL
        value: https://staging.ms-fixer.com
